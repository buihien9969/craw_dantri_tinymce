    <h1>Xem trước nội dung: Trường THCS "hot" nhất Hà Nội bỏ xét điểm học bạ vào lớp 6</h1>

    <div style="margin-bottom: 20px;">
        <h2>Thumbnail:</h2>
        <img src="/thumbnails/g1sRWYqlYRzk8QRji1pIjQoUJtNeYP.jpeg" style="max-width: 500px; border: 1px solid #ddd; padding: 5px;" />

    <p>Nội dung HTML đã được crawl và lưu vào cơ sở dữ liệu. Bạn có thể kiểm tra định dạng dưới đây:</p>

    <textarea id="editor"><div class="singular-content"><p>Theo đó, Trường THCS Cầu Giấy giữ nguyên 440 chỉ tiêu như năm 2024 nhưng phương thức <a data-auto-link-id="61358c8dfb044100119a1476" data-content-name="article-content-autolink" data-content-piece="article-content-autolink_61358c8dfb044100119a1476" data-content-target="/giao-duc/truong-thcs-hot-nhat-ha-noi-bo-xet-diem-hoc-ba-vao-lop-6-20250415163806091.htm" data-track-content="" href="https://dantri.com.vn/giao-duc/tuyen-sinh.htm">tuyển sinh</a> thay đổi.</p><p>Thí sinh dự thi phải tham gia bài đánh giá năng lực gồm 3 môn: Toán, tiếng Việt và tiếng Anh.</p><p>Bài thi có định dạng trắc nghiệm kết hợp tự luận, nội dung chủ yếu thuộc chương trình lớp 5 - chương trình <a data-auto-link-id="614ae5144a01660018e67e19" data-content-name="article-content-autolink" data-content-piece="article-content-autolink_614ae5144a01660018e67e19" data-content-target="/giao-duc/truong-thcs-hot-nhat-ha-noi-bo-xet-diem-hoc-ba-vao-lop-6-20250415163806091.htm" data-track-content="" href="https://dantri.com.vn/giao-duc.htm">giáo dục</a> phổ thông 2018.</p><p>Mỗi bài thi có thời gian làm bài 45 phút, thang điểm 10, tính điểm tròn đến chữ số thập phân thứ 2.</p><p>Điểm xét tuyển là điểm tổng của 3 bài thi đánh giá năng lực cộng với điểm ưu tiên nếu có.</p><p>Đáng chú ý, điểm ưu tiên không dành cho thí sinh có các thành tích nổi bật trong học tập, thể thao, năng khiếu mà chỉ dành cho đối tượng chính sách. Mức điểm cộng tối thiểu là 1 và tối đa là 2.</p><figure contenteditable="false"><img alt="Trường THCS hot nhất Hà Nội bỏ xét điểm học bạ vào lớp 6 - 1" src="/storage/uploads/AgohZzz70FPNg3pL9FZQrDgN897eFz.jpeg"/></figure><p>Trường THCS Cầu Giấy dự kiến sẽ tổ chức đánh giá năng lực trong buổi sáng ngày 15/6 và công bố kết quả vào ngày 21/6.</p><p>Như vậy, so với các năm trước, trường chất lượng cao hàng đầu Hà Nội đã bỏ tính điểm học bạ vào điểm xét tuyển. Trước đó, Trường THCS và THPT Nguyễn Tất Thành cũng thông báo phương thức tuyển sinh mới không tính điểm học bạ.</p><p>Học phí năm học 2025-2026 của Trường THCS Cầu Giấy vào khoảng 3,63 triệu đồng/tháng.</p></div></textarea>
