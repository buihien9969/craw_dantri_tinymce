    <h1>Xem trước nội dung: Người Mỹ cần kiếm ít nhất 114.000 USD mỗi năm để mua được nhà</h1>
    <p>Nội dung HTML đã được crawl và lưu vào cơ sở dữ liệu. Bạn có thể kiểm tra định dạng dưới đây:</p>

    <textarea id="editor"><article class="fck_detail">
<p>Dữ liệu từ nền tảng bất động sản Realtor cho biết giá một căn nhà trung bình tại Mỹ vào tháng 4 là 431.250 USD, đòi hỏi người mua phải có thu nhập ít nhất 114.000 USD mỗi năm.</p><p>Phân tích này giả định khách hàng trả trước 20%, phần còn lại vay thế chấp lãi suất cố định 30 năm và chi phí nhà ở không vượt quá 30% thu nhập hàng tháng trước thuế – thước đo phổ biến để đánh giá khả năng chi trả.</p><p>So với 6 năm trước, người Mỹ cần thu nhập hàng năm tăng thêm 47.000 USD mỗi năm để mua được một căn nhà giá trung bình. Khi đó, giá nhà trung bình tại Mỹ là 314.950 USD và lãi suất cố định 30 năm quanh mức 4,1%. Trong khi, tuần này, mức lãi suất đã lên tới 6,76%.</p><p>Thu nhập tối thiểu hàng năm để mua một căn nhà trung bình lần đầu tiên vượt mốc 100.000 USD vào tháng 5/2022 và chưa từng hạ xuống. Theo Cục Điều tra Dân số Mỹ, thu nhập trung bình năm 2023 của hộ gia đình Mỹ khoảng 80.600 USD.</p><p>Tại nhiều đô thị lớn như San Francisco, Los Angeles, New York và Boston, thu nhập tối thiểu cần thiết để mua trả góp một căn nhà giá trung bình đều đã vượt 200.000 USD mỗi năm. Riêng San Jose, con số này hơn 370.000 USD.</p>

</figure><p>Lãi suất siêu thấp trong giai đoạn đại dịch từng khiến thị trường nhà đất Mỹ bùng nổ, đẩy giá bán lên hàng trăm nghìn USD. Tính chung giai đoạn 2019–2024, giá nhà đã tăng hơn 50%. Đến tháng 3, lượng nhà ở hiện hữu được giao dịch ghi nhận mức giảm hàng tháng mạnh nhất kể từ tháng 11/2022.</p><p>Dù vậy, vẫn có vài tín hiệu tích cực. Giá nhà đang tăng chậm hơn so với đỉnh điểm. Giá bán trung bình nhà ở hiện hữu vào tháng 3 tăng 2,7% so với cùng kỳ, lên 403.700 USD. Đây là kỷ lục của tháng 3 các năm nhưng là mức tăng thấp nhất kể từ tháng 8/2024. Đến tháng 4, giá trung bình chỉ tăng 0,3% so với cùng kỳ.</p><p>Những người đủ khả năng vay mua nhà cũng đang có nhiều lựa chọn hơn so với một năm trước. Số lượng nhà rao bán đã tăng vọt 30,6% trong tháng 4. Tại San Diego, San Jose và Washington D.C., nguồn cung nhà tăng từ 67,6% đến 70,1%.</p><p>Khi thị trường chậm hơn, khoảng 18% số căn niêm yết đã hạ giá. "Số lượng căn giảm giá cho thấy người bán đang trở nên linh hoạt hơn. Dù lãi suất cao tiếp tục đè nặng lên nhu cầu, điểm sáng là thị trường đang dần cân bằng trở lại," Danielle Hale, chuyên gia kinh tế trưởng tại Realtor nhận định.</p><p><strong>Anh Kỳ</strong> (<em>theo AP</em>)</p><span></span><div data-component="true" data-component-type="tin_xemthem" data-component-value="4854457,4847287,4845023" data-thumb="1"></div>
